<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" role="img" aria-labelledby="title desc">
<title id="title">逐位置 K/V 与 KDA 固定状态的对比</title><desc id="desc">左侧历史 K/V 不断追加；右侧新 token 通过遗忘和纠错更新固定状态矩阵，query 从该矩阵读取。</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9" fill="#52627a"/></marker></defs>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1100" height="630" rx="20" fill="#f6f8fc" stroke="none"/><text x="36" y="48" font-size="30" fill="#17243b" font-weight="650" text-anchor="start">01  历史越长，是加页，还是改写白板？</text><rect x="30" y="78" width="510" height="410" rx="16" fill="#fff" stroke="#dce3ee"/><rect x="560" y="78" width="510" height="410" rx="16" fill="#fff" stroke="#dce3ee"/><text x="55" y="119" font-size="26" fill="#3864cc" font-weight="650" text-anchor="start">普通全量注意力</text><text x="585" y="119" font-size="26" fill="#087e82" font-weight="650" text-anchor="start">KDA</text><text x="55" y="153" font-size="21" fill="#52627a" font-weight="400" text-anchor="start">每个历史位置保留 K/V</text><text x="585" y="153" font-size="21" fill="#52627a" font-weight="400" text-anchor="start">每个头保留一块状态矩阵</text><rect x="60" y="187" width="92" height="103" rx="9" fill="#edf2ff" stroke="#c8d7f5"/><text x="106" y="219" font-size="21" fill="#3864cc" font-weight="600" text-anchor="middle">t1</text><text x="106" y="254" font-size="22" fill="#3864cc" font-weight="500" text-anchor="middle">K / V</text><rect x="170" y="187" width="92" height="103" rx="9" fill="#edf2ff" stroke="#c8d7f5"/><text x="216" y="219" font-size="21" fill="#3864cc" font-weight="600" text-anchor="middle">t2</text><text x="216" y="254" font-size="22" fill="#3864cc" font-weight="500" text-anchor="middle">K / V</text><rect x="280" y="187" width="92" height="103" rx="9" fill="#edf2ff" stroke="#c8d7f5"/><text x="326" y="219" font-size="21" fill="#3864cc" font-weight="600" text-anchor="middle">t3</text><text x="326" y="254" font-size="22" fill="#3864cc" font-weight="500" text-anchor="middle">K / V</text><rect x="390" y="187" width="92" height="103" rx="9" fill="#edf2ff" stroke="#c8d7f5"/><text x="436" y="219" font-size="21" fill="#3864cc" font-weight="600" text-anchor="middle">t4</text><text x="436" y="254" font-size="22" fill="#3864cc" font-weight="500" text-anchor="middle">K / V</text><text x="260" y="333" font-size="23" fill="#52627a" font-weight="400" text-anchor="middle">…  继续追加历史位置  …</text><path d="M283 349 L283 383" fill="none" stroke="#52627a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="72" y="396" width="420" height="59" rx="10" fill="#edf2ff" stroke="none"/><text x="282" y="434" font-size="21" fill="#3864cc" font-weight="550" text-anchor="middle">query → 匹配历史 → 加权读 V</text><rect x="755" y="191" width="260" height="170" rx="13" fill="#e6f5f1" stroke="#b2dacf"/><rect x="775" y="210" width="23" height="19" rx="3" fill="#b6dcd1" stroke="none"/><rect x="806" y="210" width="23" height="19" rx="3" fill="#c9e7de" stroke="none"/><rect x="837" y="210" width="23" height="19" rx="3" fill="#93c5b7" stroke="none"/><rect x="868" y="210" width="23" height="19" rx="3" fill="#b6dcd1" stroke="none"/><rect x="899" y="210" width="23" height="19" rx="3" fill="#c9e7de" stroke="none"/><rect x="930" y="210" width="23" height="19" rx="3" fill="#93c5b7" stroke="none"/><rect x="961" y="210" width="23" height="19" rx="3" fill="#b6dcd1" stroke="none"/><rect x="775" y="236" width="23" height="19" rx="3" fill="#c9e7de" stroke="none"/><rect x="806" y="236" width="23" height="19" rx="3" fill="#93c5b7" stroke="none"/><rect x="837" y="236" width="23" height="19" rx="3" fill="#b6dcd1" stroke="none"/><rect x="868" y="236" width="23" height="19" rx="3" fill="#c9e7de" stroke="none"/><rect x="899" y="236" width="23" height="19" rx="3" fill="#93c5b7" stroke="none"/><rect x="930" y="236" width="23" height="19" rx="3" fill="#b6dcd1" stroke="none"/><rect x="961" y="236" width="23" height="19" rx="3" fill="#c9e7de" stroke="none"/><rect x="775" y="262" width="23" height="19" rx="3" fill="#93c5b7" stroke="none"/><rect x="806" y="262" width="23" height="19" rx="3" fill="#b6dcd1" stroke="none"/><rect x="837" y="262" width="23" height="19" rx="3" fill="#c9e7de" stroke="none"/><rect x="868" y="262" width="23" height="19" rx="3" fill="#93c5b7" stroke="none"/><rect x="899" y="262" width="23" height="19" rx="3" fill="#b6dcd1" stroke="none"/><rect x="930" y="262" width="23" height="19" rx="3" fill="#c9e7de" stroke="none"/><rect x="961" y="262" width="23" height="19" rx="3" fill="#93c5b7" stroke="none"/><rect x="775" y="288" width="23" height="19" rx="3" fill="#b6dcd1" stroke="none"/><rect x="806" y="288" width="23" height="19" rx="3" fill="#c9e7de" stroke="none"/><rect x="837" y="288" width="23" height="19" rx="3" fill="#93c5b7" stroke="none"/><rect x="868" y="288" width="23" height="19" rx="3" fill="#b6dcd1" stroke="none"/><rect x="899" y="288" width="23" height="19" rx="3" fill="#c9e7de" stroke="none"/><rect x="930" y="288" width="23" height="19" rx="3" fill="#93c5b7" stroke="none"/><rect x="961" y="288" width="23" height="19" rx="3" fill="#b6dcd1" stroke="none"/><rect x="775" y="314" width="23" height="19" rx="3" fill="#c9e7de" stroke="none"/><rect x="806" y="314" width="23" height="19" rx="3" fill="#93c5b7" stroke="none"/><rect x="837" y="314" width="23" height="19" rx="3" fill="#b6dcd1" stroke="none"/><rect x="868" y="314" width="23" height="19" rx="3" fill="#c9e7de" stroke="none"/><rect x="899" y="314" width="23" height="19" rx="3" fill="#93c5b7" stroke="none"/><rect x="930" y="314" width="23" height="19" rx="3" fill="#b6dcd1" stroke="none"/><rect x="961" y="314" width="23" height="19" rx="3" fill="#c9e7de" stroke="none"/><text x="650" y="219" font-size="22" fill="#087e82" font-weight="600" text-anchor="middle">新 token</text><path d="M706 248 L746 248" fill="none" stroke="#52627a" stroke-width="2.5" marker-end="url(#arr)"/><text x="601" y="292" font-size="21" fill="#087e82" font-weight="400" text-anchor="start">遗忘</text><text x="601" y="322" font-size="21" fill="#087e82" font-weight="400" text-anchor="start">纠错写入</text><text x="884" y="390" font-size="20" fill="#087e82" font-weight="500" text-anchor="middle">S：key 通道 × value 通道</text><rect x="600" y="407" width="425" height="48" rx="10" fill="#e6f5f1" stroke="none"/><text x="812" y="438" font-size="21" fill="#087e82" font-weight="550" text-anchor="middle">query → 直接读取更新后的 S</text><rect x="30" y="510" width="1040" height="95" rx="16" fill="#fff" stroke="none"/><text x="55" y="547" font-size="24" fill="#17243b" font-weight="600" text-anchor="start">KDA 的持久状态没有“历史 token 数”这一轴。</text><text x="55" y="582" font-size="22" fill="#52627a" font-weight="400" text-anchor="start">节省逐位置缓存与读取，但压缩后的记忆可能发生遗忘、覆盖和干扰。</text></g></svg>