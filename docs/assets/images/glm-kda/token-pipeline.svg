<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">KDA 的 token 数据通路</title><desc id="desc">输入分别进入 QKV、遗忘门、写入门和输出门。QKV 经过短卷积和归一化后更新记忆，再查询，最后门控归一化并投影。虚线表示持久缓存。</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9" fill="#52627a"/></marker></defs>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1100" height="760" rx="20" fill="#f6f8fc" stroke="none"/><text x="36" y="48" font-size="30" fill="#17243b" font-weight="650" text-anchor="start">02  一个 token 的 KDA 数据通路</text><rect x="30" y="78" width="1040" height="61" rx="16" fill="#eaf0fd" stroke="none"/><text x="550" y="117" font-size="24" fill="#3864cc" font-weight="600" text-anchor="middle">输入 x：4096 维（已经过 mHC 合流和 RMSNorm）</text><path d="M245 139 L245 179" fill="none" stroke="#52627a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="40" y="184" width="410" height="87" rx="16" fill="#fff" stroke="#dce3ee"/><text x="245" y="221" font-size="25" fill="#3864cc" font-weight="600" text-anchor="middle">Q / K / V 三个投影</text><text x="245" y="254" font-size="21" fill="#52627a" font-weight="400" text-anchor="middle">各 8192 维 → 拼接</text><path d="M245 271 L245 301" fill="none" stroke="#52627a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="40" y="306" width="410" height="87" rx="16" fill="#fff" stroke="#dce3ee"/><text x="245" y="343" font-size="25" fill="#3864cc" font-weight="600" text-anchor="middle">因果短卷积 + SiLU</text><text x="245" y="376" font-size="21" fill="#52627a" font-weight="400" text-anchor="middle">当前位置 + 前 3 个位置</text><path d="M245 393 L245 422" fill="none" stroke="#52627a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="40" y="427" width="410" height="87" rx="16" fill="#fff" stroke="#dce3ee"/><text x="245" y="464" font-size="23" fill="#3864cc" font-weight="600" text-anchor="middle">拆成 64 头，每头 128 维</text><text x="245" y="496" font-size="21" fill="#52627a" font-weight="400" text-anchor="middle">Q/K 做 L2Norm，Q 再缩放</text><path d="M581.5 139 L581.5 179" fill="none" stroke="#52627a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="490" y="184" width="183" height="88" rx="16" fill="#fff" stroke="#dce3ee"/><text x="581.5" y="222" font-size="24" fill="#087e82" font-weight="600" text-anchor="middle">遗忘分支</text><text x="581.5" y="253" font-size="18" fill="#52627a" font-weight="400" text-anchor="middle">α：128 维 / 头</text><path d="M782.5 139 L782.5 179" fill="none" stroke="#52627a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="691" y="184" width="183" height="88" rx="16" fill="#fff" stroke="#dce3ee"/><text x="782.5" y="222" font-size="24" fill="#c56a26" font-weight="600" text-anchor="middle">写入分支</text><text x="782.5" y="253" font-size="18" fill="#52627a" font-weight="400" text-anchor="middle">β：1 个 / 头</text><path d="M983.5 139 L983.5 179" fill="none" stroke="#52627a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="892" y="184" width="183" height="88" rx="16" fill="#fff" stroke="#dce3ee"/><text x="983.5" y="222" font-size="24" fill="#3864cc" font-weight="600" text-anchor="middle">输出分支</text><text x="983.5" y="253" font-size="18" fill="#52627a" font-weight="400" text-anchor="middle">z：128 维 / 头</text><rect x="510" y="347" width="340" height="159" rx="16" fill="#e6f5f1" stroke="#b2dacf"/><text x="680" y="382" font-size="26" fill="#087e82" font-weight="650" text-anchor="middle">KDA 记忆核心</text><text x="540" y="420" font-size="21" fill="#087e82" font-weight="400" text-anchor="start">① 遗忘旧状态</text><text x="540" y="451" font-size="21" fill="#087e82" font-weight="400" text-anchor="start">② 用 key 预测，再纠错写入</text><text x="540" y="482" font-size="21" fill="#087e82" font-weight="400" text-anchor="start">③ 用 query 读新状态</text><path d="M581 272 L581 328 L608 328 L608 339" fill="none" stroke="#52627a" stroke-width="2.5" marker-end="url(#arr)"/><path d="M782 272 L782 328 L747 328 L747 339" fill="none" stroke="#52627a" stroke-width="2.5" marker-end="url(#arr)"/><path d="M450 470 L501 470" fill="none" stroke="#52627a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="516" y="546" width="328" height="61" rx="16" fill="#fff" stroke="#dce3ee"/><text x="680" y="583" font-size="20" fill="#087e82" font-weight="600" text-anchor="middle">循环状态 S：128 × 128 / 头</text><path d="M844 576 L875 576 L875 437 L858 437" fill="none" stroke="#52627a" stroke-width="2.5" marker-end="url(#arr)" stroke-dasharray="7 6"/><path d="M620 506 L620 537" fill="none" stroke="#52627a" stroke-width="2.5" marker-end="url(#arr)" stroke-dasharray="7 6"/><rect x="80" y="549" width="335" height="58" rx="16" fill="#fff" stroke="#dce3ee"/><text x="247" y="585" font-size="22" fill="#3864cc" font-weight="500" text-anchor="middle">短卷积尾部缓存</text><path d="M80 578 L18 578 L18 348 L31 348" fill="none" stroke="#52627a" stroke-width="2.5" marker-end="url(#arr)" stroke-dasharray="7 6"/><path d="M806 506 L919 536 L919 635" fill="none" stroke="#52627a" stroke-width="2.5" marker-end="url(#arr)"/><path d="M984 272 L1055 272 L1055 659 L1017 659" fill="none" stroke="#52627a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="35" y="640" width="978" height="93" rx="16" fill="#edf2ff" stroke="none"/><text x="525" y="677" font-size="23" fill="#3864cc" font-weight="600" text-anchor="middle">每头 RMSNorm × sigmoid(z) → 拼成 8192 维 → 输出投影</text><text x="525" y="711" font-size="22" fill="#52627a" font-weight="400" text-anchor="middle">返回 4096 维，进入本层后续计算</text></g></svg>