<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730" role="img" aria-labelledby="title desc">
<title id="title">二维 KDA 状态更新手算</title><desc id="desc">状态从对角元素 2 和 4 开始，按 0.5 和 0.75 衰减。key 为 1,0，value 为 3,2，beta 为 0.5，修正后状态为 2,1;0,3。</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9" fill="#52627a"/></marker></defs>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1100" height="730" rx="20" fill="#f6f8fc" stroke="none"/><text x="36" y="48" font-size="30" fill="#17243b" font-weight="650" text-anchor="start">03  用 2 × 2 白板，手算一次状态更新</text><rect x="30" y="84" width="330" height="358" rx="16" fill="#fff" stroke="#dce3ee"/><rect x="385" y="84" width="330" height="358" rx="16" fill="#fff" stroke="#dce3ee"/><rect x="740" y="84" width="330" height="358" rx="16" fill="#fff" stroke="#dce3ee"/><text x="55" y="124" font-size="25" fill="#087e82" font-weight="650" text-anchor="start">① 逐行遗忘</text><text x="410" y="124" font-size="23" fill="#c56a26" font-weight="650" text-anchor="start">② 检查预测，计算差额</text><text x="765" y="124" font-size="25" fill="#087e82" font-weight="650" text-anchor="start">③ 外积写入</text><rect x="60" y="152" width="57" height="57" rx="7" fill="#eef3fd" stroke="none"/><text x="88.5" y="191.0" font-size="27" fill="#17243b" font-weight="600" text-anchor="middle">2</text><rect x="120" y="152" width="57" height="57" rx="7" fill="#eef3fd" stroke="none"/><text x="148.5" y="191.0" font-size="27" fill="#17243b" font-weight="600" text-anchor="middle">0</text><rect x="60" y="212" width="57" height="57" rx="7" fill="#eef3fd" stroke="none"/><text x="88.5" y="251.0" font-size="27" fill="#17243b" font-weight="600" text-anchor="middle">0</text><rect x="120" y="212" width="57" height="57" rx="7" fill="#eef3fd" stroke="none"/><text x="148.5" y="251.0" font-size="27" fill="#17243b" font-weight="600" text-anchor="middle">4</text><text x="206" y="187" font-size="18" fill="#087e82" font-weight="400" text-anchor="start">第 1 行 × 0.5</text><text x="206" y="245" font-size="18" fill="#087e82" font-weight="400" text-anchor="start">第 2 行 × 0.75</text><path d="M120 280 L120 313" fill="none" stroke="#52627a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="60" y="327" width="45" height="45" rx="7" fill="#d5ede4" stroke="none"/><text x="82.5" y="358.2" font-size="27" fill="#17243b" font-weight="600" text-anchor="middle">1</text><rect x="108" y="327" width="45" height="45" rx="7" fill="#d5ede4" stroke="none"/><text x="130.5" y="358.2" font-size="27" fill="#17243b" font-weight="600" text-anchor="middle">0</text><rect x="60" y="375" width="45" height="45" rx="7" fill="#e4f2ed" stroke="none"/><text x="82.5" y="406.2" font-size="27" fill="#17243b" font-weight="600" text-anchor="middle">0</text><rect x="108" y="375" width="45" height="45" rx="7" fill="#e4f2ed" stroke="none"/><text x="130.5" y="406.2" font-size="27" fill="#17243b" font-weight="600" text-anchor="middle">3</text><text x="184" y="354" font-size="21" fill="#087e82" font-weight="600" text-anchor="start">遗忘后</text><text x="184" y="386" font-size="18" fill="#52627a" font-weight="400" text-anchor="start">第一行是 (1, 0)</text><text x="410" y="170" font-size="21" fill="#52627a" font-weight="400" text-anchor="start">key = (1, 0)</text><text x="410" y="210" font-size="21" fill="#52627a" font-weight="400" text-anchor="start">读取第一行：旧预测 (1, 0)</text><text x="410" y="250" font-size="21" fill="#52627a" font-weight="400" text-anchor="start">目标 value = (3, 2)</text><rect x="407" y="290" width="285" height="119" rx="12" fill="#fff1e6" stroke="none"/><text x="426" y="326" font-size="20" fill="#c56a26" font-weight="600" text-anchor="start">差额 = (3, 2) − (1, 0)</text><text x="426" y="361" font-size="20" fill="#c56a26" font-weight="400" text-anchor="start">β = 0.5，只写一半</text><text x="426" y="393" font-size="23" fill="#c56a26" font-weight="650" text-anchor="start">δ = (1, 1)</text><text x="765" y="169" font-size="21" fill="#52627a" font-weight="400" text-anchor="start">修正量 = key × δᵀ</text><rect x="770" y="193" width="48" height="48" rx="7" fill="#ffe4cb" stroke="none"/><text x="794.0" y="226.15" font-size="27" fill="#17243b" font-weight="600" text-anchor="middle">1</text><rect x="821" y="193" width="48" height="48" rx="7" fill="#ffe4cb" stroke="none"/><text x="845.0" y="226.15" font-size="27" fill="#17243b" font-weight="600" text-anchor="middle">1</text><rect x="770" y="244" width="48" height="48" rx="7" fill="#f0f2f6" stroke="none"/><text x="794.0" y="277.15" font-size="27" fill="#17243b" font-weight="600" text-anchor="middle">0</text><rect x="821" y="244" width="48" height="48" rx="7" fill="#f0f2f6" stroke="none"/><text x="845.0" y="277.15" font-size="27" fill="#17243b" font-weight="600" text-anchor="middle">0</text><text x="899" y="222" font-size="20" fill="#c56a26" font-weight="400" text-anchor="start">只修正</text><text x="899" y="253" font-size="20" fill="#c56a26" font-weight="400" text-anchor="start">第一行</text><path d="M825 303 L825 321" fill="none" stroke="#52627a" stroke-width="2.5" marker-end="url(#arr)"/><rect x="770" y="334" width="45" height="45" rx="7" fill="#d5ede4" stroke="none"/><text x="792.5" y="365.2" font-size="27" fill="#17243b" font-weight="600" text-anchor="middle">2</text><rect x="818" y="334" width="45" height="45" rx="7" fill="#d5ede4" stroke="none"/><text x="840.5" y="365.2" font-size="27" fill="#17243b" font-weight="600" text-anchor="middle">1</text><rect x="770" y="382" width="45" height="45" rx="7" fill="#e4f2ed" stroke="none"/><text x="792.5" y="413.2" font-size="27" fill="#17243b" font-weight="600" text-anchor="middle">0</text><rect x="818" y="382" width="45" height="45" rx="7" fill="#e4f2ed" stroke="none"/><text x="840.5" y="413.2" font-size="27" fill="#17243b" font-weight="600" text-anchor="middle">3</text><text x="900" y="361" font-size="22" fill="#087e82" font-weight="600" text-anchor="start">新状态 S</text><text x="900" y="394" font-size="20" fill="#52627a" font-weight="400" text-anchor="start">准备查询</text><rect x="30" y="470" width="1040" height="157" rx="16" fill="#eaf0fd" stroke="none"/><text x="55" y="511" font-size="26" fill="#3864cc" font-weight="650" text-anchor="start">④ query 决定从新白板读什么</text><text x="55" y="554" font-size="24" fill="#3864cc" font-weight="600" text-anchor="start">q = (1, 0) → 读出 (2, 1)</text><text x="580" y="554" font-size="24" fill="#3864cc" font-weight="600" text-anchor="start">q = (0, 1) → 读出 (0, 3)</text><text x="55" y="596" font-size="22" fill="#52627a" font-weight="400" text-anchor="start">第一个读数：从旧预测 (1, 0) 向目标 (3, 2) 前进了一半。</text><text x="40" y="669" font-size="21" fill="#52627a" font-weight="400" text-anchor="start">教学简化：省略 query 缩放与输出归一化；各维度没有预设的人类语义。</text><text x="40" y="703" font-size="21" fill="#52627a" font-weight="400" text-anchor="start">真实 key 通常同时激活多行，写入可能影响其他关联。</text></g></svg>